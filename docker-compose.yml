version: "3.9"

services:
  # Base de données Redis pour la file d'attente des votes
  redis:
    image: redis:7
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Base de données PostgreSQL pour le stockage persistant des votes
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: vote
      POSTGRES_PASSWORD: vote
      POSTGRES_DB: votedb
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vote -d votedb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Application web de vote (Python Flask)
  vote:
    build: ./vote
    ports:
      - "5000:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # Service worker (.NET) qui transfère les votes de Redis vers PostgreSQL
  worker:
    build: ./worker
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # Application web de résultats (Node.js)
  result:
    build: ./result
    ports:
      - "5001:8888"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

# Volume pour la persistance des données PostgreSQL
volumes:
  db-data:

# Réseaux pour isoler les composants
networks:
  # Réseau frontend : accessible par les applications web
  frontend:
  # Réseau backend : pour les communications internes
  backend:
