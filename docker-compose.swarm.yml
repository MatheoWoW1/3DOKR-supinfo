version: "3.9"

services:

  vote:
    image: voting-app_vote
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    ports:
      - "5000:80"
    networks:
      - frontend
      - backend

  result:
    image: voting-app_result
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    ports:
      - "5001:80"
    networks:
      - frontend
      - backend

  worker:
    image: voting-app_worker
    deploy:
      replicas: 1
    networks:
      - backend

  redis:
    image: redis:7
    networks:
      - backend

  db:
    image: postgres:15
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  db-data:

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
